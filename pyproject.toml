[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "developmental-chromatin-accessibility"
version = "0.1.0"
description = "Sequence models for developmental chromatin-accessibility prediction"
readme = "README.md"
requires-python = ">=3.10"
authors = [{name = "Cheng Jin"}]
dependencies = [
  "matplotlib>=3.8,<4",
  "numpy>=1.26,<3",
  "pandas>=2.1,<3",
  "scikit-learn>=1.3,<2",
  "scipy>=1.11,<2",
  "torch>=2.3,<3",
  "tqdm>=4.66,<5",
  "transformers>=4.38,<5",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "ruff>=0.6,<1"]
figures = ["reportlab>=4,<5", "pypdfium2>=4,<6"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.pytest.ini_options]
testpaths = ["tests"]
